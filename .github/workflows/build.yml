name: Build IraqAI PlayStore Ready
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.22.2'}
      - name: Build Production App Ready for Play Store
        run: |
          rm -rf android
          flutter create. --org com.iraqai --project-name iraqai_chat --platforms=android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="iraqai_chat"/android:label="IraqAI Chat+"/' android/app/src/main/AndroidManifest.xml
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:google_generative_ai/google_generative_ai.dart';
          const GEMINI_API_KEY = String.fromEnvironment('GEMINI_API_KEY', defaultValue: '');
          void main()=>runApp(const IraqAIApp());
          class IraqAIApp extends StatelessWidget{const IraqAIApp({super.key});@override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false,theme:ThemeData.dark().copyWith(scaffoldBackgroundColor:const Color(0xFF0A0A12)),home:const Splash());}
          class Splash extends StatefulWidget{const Splash({super.key});@override State<Splash> createState()=>_S();}
          class _S extends State<Splash>{
            @override void initState(){super.initState(); Future.delayed(const Duration(seconds:2),(){Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const MainNav()));});}
            @override Widget build(BuildContext c)=>Scaffold(body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Container(width:90,height:90,decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF7C3AED),Color(0xFF6D28D9)]),borderRadius:BorderRadius.circular(22)),child:const Icon(Icons.smart_toy,size:45,color:Colors.white)),const SizedBox(height:20),const Text('IraqAI Chat+',style:TextStyle(fontSize:28,fontWeight:FontWeight.bold)),const Text('ريلزات • محفظة • ذكاء اصطناعي',style:TextStyle(color:Colors.white54)),const SizedBox(height:30),const CircularProgressIndicator(color:Color(0xFF7C3AED))])));
          }
          class MainNav extends StatefulWidget{const MainNav({super.key});@override State<MainNav> createState()=>_N();}
          class _N extends State<MainNav>{
            int idx=0;
            final pages=[const ReelsPage(), const WalletPage(), const ChatPage(), const EarnPage(), const ProfilePage()];
            @override Widget build(BuildContext c)=>Scaffold(body: pages[idx],bottomNavigationBar: BottomNavigationBar(currentIndex:idx,onTap:(i)=>setState(()=>idx=i),backgroundColor:const Color(0xFF1A1A2E),selectedItemColor:const Color(0xFF7C3AED),unselectedItemColor:Colors.white54,type:BottomNavigationBarType.fixed,items:const [BottomNavigationBarItem(icon:Icon(Icons.play_circle_fill),label:'ريلزات'),BottomNavigationBarItem(icon:Icon(Icons.account_balance_wallet),label:'المحفظة'),BottomNavigationBarItem(icon:Icon(Icons.chat_bubble),label:'دردشة'),BottomNavigationBarItem(icon:Icon(Icons.monetization_on),label:'أرباح'),BottomNavigationBarItem(icon:Icon(Icons.person),label:'حسابي')]));
          }
          class ReelsPage extends StatefulWidget{const ReelsPage({super.key});@override State<ReelsPage> createState()=>_Reels();}
          class _Reels extends State<ReelsPage>{
            int coins=18750;
            void addCoins(){setState(()=>coins+=50); ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تم اضافة 50 د.ع • رصيدك: $coins'),backgroundColor:Colors.green,behavior:SnackBarBehavior.floating));}
            @override Widget build(BuildContext c)=>Scaffold(backgroundColor:Colors.black,appBar:AppBar(backgroundColor:Colors.black,title:const Text('ريلزات • اربح بالمشاهدة'),actions:[Container(margin:const EdgeInsets.all(10),padding:const EdgeInsets.symmetric(horizontal:12,vertical:6),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(20)),child:Text('$coins د.ع',style:const TextStyle(color:Colors.greenAccent)))]),body: PageView.builder(itemCount:5,itemBuilder:(c,i)=>Stack(children:[Container(decoration:BoxDecoration(gradient:LinearGradient(colors:[Colors.primaries[i%Colors.primaries.length].shade900,Colors.black])),child:const Center(child:Icon(Icons.play_circle_fill,size:80,color:Colors.white54))),Center(child:ElevatedButton.icon(onPressed:addCoins,icon:const Icon(Icons.visibility),label:const Text('شاهد واربح 50 د.ع'),style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF7C3AED)))),Positioned(left:12,right:70,bottom:30,child:Text('فيديو #${i+1} - شاهد واربح',style:const TextStyle(color:Colors.white)))])));
          }
          class WalletPage extends StatelessWidget{const WalletPage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('المحفظة')),body:ListView(padding:const EdgeInsets.all(16),children:[Container(padding:const EdgeInsets.all(22),decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF10B981),Color(0xFF059669)]),borderRadius:BorderRadius.circular(22)),child:Column(children:[const Text('رصيدك'),const Text('18,750 د.ع',style:TextStyle(fontSize:32,fontWeight:FontWeight.bold)),Row(children:[Expanded(child:ElevatedButton(onPressed:(){},child:const Text('سحب'))),const SizedBox(width:10),Expanded(child:ElevatedButton(onPressed:(){},child:const Text('ارسال')))])]))]));}
          class ChatPage extends StatefulWidget{const ChatPage({super.key});@override State<ChatPage> createState()=>_C();}
          class _C extends State<ChatPage>{
            final ctrl=TextEditingController(); final msgs=[{"role":"ai","text":"هلا! انا IraqAI"}]; bool load=false; late ChatSession chat;
            @override void initState(){super.initState(); final m=GenerativeModel(model:'gemini-2.0-flash',apiKey:GEMINI_API_KEY.isEmpty?'test':GEMINI_API_KEY); chat=m.startChat();}
            void send() async{ if(ctrl.text.isEmpty) return; final q=ctrl.text; setState((){msgs.add({"role":"user","text":q}); load=true;}); ctrl.clear(); try{final r=await chat.sendMessage(Content.text(q)); setState(()=>msgs.add({"role":"ai","text":r.text??''}));}catch(e){setState(()=>msgs.add({"role":"ai","text":"خطأ"}));} setState(()=>load=false);}
            @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('دردشة')),body:Column(children:[Expanded(child:ListView.builder(padding:const EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(c,i){final m=msgs[i];final u=m['role']=='user';return Align(alignment:u?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:4),padding:const EdgeInsets.all(12),decoration:BoxDecoration(color:u?const Color(0xFF7C3AED):const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(16)),child:Text(m['text']!)));})), if(load) const LinearProgressIndicator(), Padding(padding:const EdgeInsets.all(10),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'احجي...',filled:true,fillColor:const Color(0xFF1E1E2A),border:OutlineInputBorder(borderRadius:BorderRadius.circular(25),borderSide:BorderSide.none)))),const SizedBox(width:8),CircleAvatar(backgroundColor:const Color(0xFF7C3AED),child:IconButton(icon:const Icon(Icons.send),onPressed:send))]))]));
          }
          class EarnPage extends StatelessWidget{const EarnPage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('أرباح')),body:ListView(padding:const EdgeInsets.all(16),children:[Container(padding:const EdgeInsets.all(16),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('15,420 مشاهدة'),Text('2,300 د.ع اليوم')]))]));}
          class ProfilePage extends StatelessWidget{const ProfilePage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('حسابي')),body:const Center(child:Text('إبراهيم الجواد - Premium')));}
          DART
          cat > pubspec.yaml << 'YAML'
          name: iraqai_chat
          description: IraqAI Full
          publish_to: 'none'
          version: 1.0.0+13
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            google_generative_ai: ^0.4.4
          flutter:
            uses-material-design: true
          YAML
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - run: flutter build appbundle --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: iraqai-playstore-ready
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
