name: Build IraqAI APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.22.2'}
      - name: Build Full App No Flags + Reels + Wallet
        run: |
          rm -rf android
          flutter create. --platforms=android --project-name iraqai_chat
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n <application/' android/app/src/main/AndroidManifest.xml
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:google_generative_ai/google_generative_ai.dart';
          const GEMINI_API_KEY = String.fromEnvironment('GEMINI_API_KEY', defaultValue: '');
          void main()=>runApp(const IraqAIApp());
          class IraqAIApp extends StatelessWidget{const IraqAIApp({super.key});@override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false,theme:ThemeData.dark().copyWith(scaffoldBackgroundColor:const Color(0xFF0A0A12)),home:const MainNav());}
          class MainNav extends StatefulWidget{const MainNav({super.key});@override State<MainNav> createState()=>_N();}
          class _N extends State<MainNav>{
            int idx=0;
            final pages=[const ReelsPage(), const WalletPage(), const ChatPage(), const EarnPage(), const ProfilePage()];
            @override Widget build(BuildContext c)=>Scaffold(
              body: pages[idx],
              bottomNavigationBar: BottomNavigationBar(currentIndex:idx,onTap:(i)=>setState(()=>idx=i),backgroundColor:const Color(0xFF1A1A2E),selectedItemColor:const Color(0xFF7C3AED),unselectedItemColor:Colors.white54,type:BottomNavigationBarType.fixed,
                items:const [BottomNavigationBarItem(icon:Icon(Icons.play_circle_fill),label:'ريلزات'),BottomNavigationBarItem(icon:Icon(Icons.account_balance_wallet),label:'المحفظة'),BottomNavigationBarItem(icon:Icon(Icons.chat_bubble),label:'دردشة'),BottomNavigationBarItem(icon:Icon(Icons.monetization_on),label:'أرباح'),BottomNavigationBarItem(icon:Icon(Icons.person),label:'حسابي')])
            );
          }
          class ReelsPage extends StatefulWidget{const ReelsPage({super.key});@override State<ReelsPage> createState()=>_Reels();}
          class _Reels extends State<ReelsPage>{
            int coins=12750; int views=0;
            @override Widget build(BuildContext c)=>Scaffold(
              backgroundColor:Colors.black,
              appBar:AppBar(backgroundColor:Colors.black,title:const Text('ريلزات • اربح من المشاهدة'),actions:[Container(margin:const EdgeInsets.all(10),padding:const EdgeInsets.symmetric(horizontal:12,vertical:6),decoration:BoxDecoration(color:Colors.green.withOpacity(0.2),borderRadius:BorderRadius.circular(20)),child:Text('$coins د.ع',style:const TextStyle(color:Colors.greenAccent,fontWeight:FontWeight.bold)))]),
              body: PageView.builder(itemCount:10,itemBuilder:(c,i)=>Stack(children:[
                Container(decoration:BoxDecoration(gradient:LinearGradient(begin:Alignment.topCenter,end:Alignment.bottomCenter,colors:[Colors.purple.shade900,Colors.black])),child:const Center(child:Icon(Icons.play_circle_fill,size:80,color:Colors.white54))),
                Positioned(right:12,bottom:100,child:Column(children:[_sideBtn(Icons.favorite,'12.5K'),_sideBtn(Icons.comment,'892'),_sideBtn(Icons.share,'1.2K'),_sideBtn(Icons.card_giftcard,'هدية')])),
                Positioned(left:12,right:70,bottom:20,child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[const Text('@ibrahim_97 • يتابعك',style:TextStyle(fontWeight:FontWeight.bold)),const SizedBox(height:6),Text('فيديو #${i+1} - شاهد واربح فلوس! كل مشاهدة +50 د.ع',style:const TextStyle(color:Colors.white70)),const SizedBox(height:10),LinearProgressIndicator(value:(i+1)/10,color:const Color(0xFF7C3AED)),const SizedBox(height:6),Row(children:[Container(padding:const EdgeInsets.symmetric(horizontal:8,vertical:4),decoration:BoxDecoration(color:Colors.green,borderRadius:BorderRadius.circular(12)),child:const Text('+50 د.ع',style:TextStyle(fontSize:12))),const SizedBox(width:8),Text('مشاهدة ${views+i*5}',style:const TextStyle(fontSize:12,color:Colors.white54))])])),
                Positioned(top:100,left:0,right:0,child:Center(child:ElevatedButton.icon(onPressed:(){setState((){coins+=50; views++;}); ScaffoldMessenger.of(c).showSnackBar(const SnackBar(content:Text('تم اضافة 50 د.ع الى محفظتك!')));},icon:const Icon(Icons.monetization_on),label:const Text('شاهد واربح'),style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF7C3AED))))),
              ]))
            );
          }
          Widget _sideBtn(IconData ic,String txt)=>Padding(padding:const EdgeInsets.symmetric(vertical:8),child:Column(children:[CircleAvatar(backgroundColor:Colors.white24,child:Icon(ic,color:Colors.white)),const SizedBox(height:4),Text(txt,style:const TextStyle(fontSize:10))]));
          class WalletPage extends StatelessWidget{const WalletPage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(backgroundColor:const Color(0xFF1A1A2E),title:const Text('المحفظة')),body:ListView(padding:const EdgeInsets.all(16),children:[
            Container(padding:const EdgeInsets.all(20),decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF10B981),Color(0xFF059669)]),borderRadius:BorderRadius.circular(20)),child:Column(children:[const Text('رصيدك الحالي',style:TextStyle(color:Colors.white70)),const SizedBox(height:8),const Text('18,750 د.ع',style:TextStyle(fontSize:32,fontWeight:FontWeight.bold)),const Text('~ \$12.50',style:TextStyle(color:Colors.white70)),const SizedBox(height:16),Row(children:[Expanded(child:ElevatedButton.icon(onPressed:(){},icon:const Icon(Icons.arrow_upward),label:const Text('سحب'),style:ElevatedButton.styleFrom(backgroundColor:Colors.white,foregroundColor:Colors.green))),const SizedBox(width:12),Expanded(child:ElevatedButton.icon(onPressed:(){},icon:const Icon(Icons.send),label:const Text('ارسال'),style:ElevatedButton.styleFrom(backgroundColor:Colors.black54,foregroundColor:Colors.white)))])])),
            const SizedBox(height:20), const Text('طرق السحب',style:TextStyle(fontWeight:FontWeight.bold,fontSize:16)), const SizedBox(height:10),
            _pay('ZainCash','سحب فوري • 0% عمولة',Icons.phone_iphone),_pay('AsiaHawala','سحب فوري • 1%',Icons.account_balance),_pay('USDT TRC20','سحب 24 ساعة • 0%',Icons.currency_bitcoin),_pay('PayPal','سحب 2-3 ايام',Icons.payment),
            const SizedBox(height:20), const Text('سجل العمليات',style:TextStyle(fontWeight:FontWeight.bold)), ListTile(leading:const CircleAvatar(backgroundColor:Colors.green,child:Icon(Icons.add,color:Colors.white)),title:const Text('+500 د.ع'),subtitle:const Text('مشاهدة ريلز #42'),trailing:const Text('اليوم 10:30')), ListTile(leading:const CircleAvatar(backgroundColor:Colors.red,child:Icon(Icons.arrow_upward,color:Colors.white)),title:const Text('-2,000 د.ع'),subtitle:const Text('سحب ZainCash'),trailing:const Text('امس')),
          ]));}
          Widget _pay(String t,String d,IconData ic)=>Container(margin:const EdgeInsets.only(bottom:10),padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:Row(children:[CircleAvatar(backgroundColor:const Color(0xFF2A2A40),child:Icon(ic,color:Colors.white)),const SizedBox(width:12),Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(t,style:const TextStyle(fontWeight:FontWeight.bold)),Text(d,style:const TextStyle(fontSize:11,color:Colors.white54))])),const Icon(Icons.arrow_forward_ios,size:14)]));
          class ChatPage extends StatefulWidget{const ChatPage({super.key});@override State<ChatPage> createState()=>_Chat();}
          class _Chat extends State<ChatPage>{
            final ctrl=TextEditingController(); final msgs=[{"role":"ai","text":"هلا والله! انا IraqAI Chat+\nاحجيلي واني اجاوبك"}]; bool loading=false; late ChatSession chat;
            @override void initState(){super.initState(); final model=GenerativeModel(model:'gemini-2.0-flash',apiKey:GEMINI_API_KEY.isEmpty?'test':GEMINI_API_KEY, systemInstruction:Content.text('انت مساعد ذكي يحجي لهجة عراقية عامية بغدادية، مفيد ومضحك')); chat=model.startChat();}
            void send() async{ if(ctrl.text.trim().isEmpty) return; final q=ctrl.text; setState((){msgs.add({"role":"user","text":q}); loading=true;}); ctrl.clear(); try{final r=await chat.sendMessage(Content.text(q)); setState(()=>msgs.add({"role":"ai","text":r.text??''}));}catch(e){setState(()=>msgs.add({"role":"ai","text":"خطأ: $e"}));} setState(()=>loading=false);}
            @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('دردشة ذكية')),body:Column(children:[Expanded(child:ListView.builder(padding:const EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(c,i){final m=msgs[i];final isU=m['role']=='user';return Align(alignment:isU?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:4),padding:const EdgeInsets.all(12),constraints:BoxConstraints(maxWidth:MediaQuery.of(c).size.width*0.8),decoration:BoxDecoration(color:isU?const Color(0xFF7C3AED):const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(16)),child:Text(m['text']!)));})), if(loading) const LinearProgressIndicator(), Padding(padding:const EdgeInsets.all(10),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'احجي...',filled:true,fillColor:const Color(0xFF1E1E2A),border:OutlineInputBorder(borderRadius:BorderRadius.circular(25),borderSide:BorderSide.none)),onSubmitted:(_)=>send())),const SizedBox(width:8),CircleAvatar(backgroundColor:const Color(0xFF7C3AED),child:IconButton(icon:const Icon(Icons.send),onPressed:send))]))]));
          }
          class EarnPage extends StatelessWidget{const EarnPage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('ارباح المشاهدات')),body:ListView(padding:const EdgeInsets.all(16),children:[Row(children:[Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('15,420',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)),Text('مشاهدة',style:TextStyle(fontSize:12,color:Colors.white54))]))),const SizedBox(width:10),Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('2,300 د.ع',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold,color:Colors.green)),Text('اليوم',style:TextStyle(fontSize:12,color:Colors.white54))]))),const SizedBox(width:10),Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('3س 24د',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)),Text('وقت',style:TextStyle(fontSize:12,color:Colors.white54))])))]),const SizedBox(height:16),_taskE('شاهد 10 ريلزات','+1,500 د.ع',0.6),_taskE('اعجاب 20 فيديو','+800 د.ع',0.3),_taskE('انشر ريلز واحد','+3,000 د.ع',0.0),Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF7C3AED),Color(0xFF6D28D9)]),borderRadius:BorderRadius.circular(14)),child:Row(children:[const Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text('دعوة اصدقاء',style:TextStyle(fontWeight:FontWeight.bold)),Text('اربح 2,000 لكل صديق',style:TextStyle(fontSize:12))])),ElevatedButton(onPressed:(){},child:const Text('نسخ الرابط'))]))]));}
          Widget _taskE(String t,String r,double p)=>Container(margin:const EdgeInsets.only(bottom:10),padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:Column(children:[Row(mainAxisAlignment:MainAxisAlignment.spaceBetween,children:[Text(t),Text(r,style:const TextStyle(color:Colors.green))]),const SizedBox(height:8),LinearProgressIndicator(value:p,color:const Color(0xFF7C3AED))]));
          class ProfilePage extends StatelessWidget{const ProfilePage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('حسابي')),body:ListView(padding:const EdgeInsets.all(16),children:[Center(child:Column(children:[const CircleAvatar(radius:40,backgroundColor:Color(0xFF7C3AED),child:Text('إ',style:TextStyle(fontSize:30))),const SizedBox(height:10),const Text('إبراهيم الجواد',style:TextStyle(fontSize:18,fontWeight:FontWeight.bold)),Container(padding:const EdgeInsets.symmetric(horizontal:8,vertical:3),decoration:BoxDecoration(color:Colors.amber.withOpacity(0.2),borderRadius:BorderRadius.circular(8)),child:const Text('Premium',style:TextStyle(color:Colors.amber,fontSize:12)))])),const SizedBox(height:20),const ListTile(leading:Icon(Icons.settings),title:Text('الاعدادات')),const ListTile(leading:Icon(Icons.share),title:Text('مشاركة التطبيق')),const ListTile(leading:Icon(Icons.star),title:Text('قيمنا'))]));}
          DART
          cat > pubspec.yaml << 'YAML'
          name: iraqai_chat
          description: IraqAI Full No Flags
          publish_to: 'none'
          version: 1.0.0+11
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            google_generative_ai: ^0.4.4
          flutter:
            uses-material-design: true
          YAML
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: iraqai-full-no-flags-reels-wallet
          path: build/app/outputs/flutter-apk/app-release.apk
