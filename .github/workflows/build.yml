name: Build IraqAI PlayStore Ready
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.22.2'}
      - name: Build Production App Ready for Play Store
        run: |
          rm -rf android lib
          flutter create. --org com.iraqai --project-name iraqai_chat --platforms=android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n <application/' android/app/src/main/AndroidManifest.xml
          # تعديل اسم التطبيق
          sed -i 's/android:label="iraqai_chat"/android:label="IraqAI Chat+"/' android/app/src/main/AndroidManifest.xml

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:google_generative_ai/google_generative_ai.dart';
          const GEMINI_API_KEY = String.fromEnvironment('GEMINI_API_KEY', defaultValue: '');
          void main()=>runApp(const IraqAIApp());
          class IraqAIApp extends StatelessWidget{
            const IraqAIApp({super.key});
            @override Widget build(BuildContext c)=>MaterialApp(
              debugShowCheckedModeBanner:false,
              theme:ThemeData.dark().copyWith(scaffoldBackgroundColor:const Color(0xFF0A0A12)),
              home: const Splash(),
            );
          }
          class Splash extends StatefulWidget{const Splash({super.key});@override State<Splash> createState()=>_S();}
          class _S extends State<Splash>{
            @override void initState(){super.initState(); Future.delayed(const Duration(seconds:2),(){Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const MainNav()));});}
            @override Widget build(BuildContext c)=>Scaffold(body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Container(width:90,height:90,decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF7C3AED),Color(0xFF6D28D9)]),borderRadius:BorderRadius.circular(22)),child:const Icon(Icons.smart_toy,size:45,color:Colors.white)),const SizedBox(height:20),const Text('IraqAI Chat+',style:TextStyle(fontSize:28,fontWeight:FontWeight.bold)),const Text('ريلزات • محفظة • ذكاء اصطناعي',style:TextStyle(color:Colors.white54)),const SizedBox(height:30),const CircularProgressIndicator(color:Color(0xFF7C3AED))])));
          }
          class MainNav extends StatefulWidget{const MainNav({super.key});@override State<MainNav> createState()=>_N();}
          class _N extends State<MainNav>{
            int idx=0;
            final pages=[const ReelsPage(), const WalletPage(), const ChatPage(), const EarnPage(), const ProfilePage()];
            @override Widget build(BuildContext c)=>Scaffold(
              body: pages[idx],
              bottomNavigationBar: BottomNavigationBar(currentIndex:idx,onTap:(i)=>setState(()=>idx=i),backgroundColor:const Color(0xFF1A1A2E),selectedItemColor:const Color(0xFF7C3AED),unselectedItemColor:Colors.white54,type:BottomNavigationBarType.fixed,
                items:const [BottomNavigationBarItem(icon:Icon(Icons.play_circle_fill),label:'ريلزات'),BottomNavigationBarItem(icon:Icon(Icons.account_balance_wallet),label:'المحفظة'),BottomNavigationBarItem(icon:Icon(Icons.chat_bubble),label:'دردشة'),BottomNavigationBarItem(icon:Icon(Icons.monetization_on),label:'أرباح'),BottomNavigationBarItem(icon:Icon(Icons.person),label:'حسابي')])
            );
          }
          // ===== REELS PAGE WITH EARNING =====
          class ReelsPage extends StatefulWidget{const ReelsPage({super.key});@override State<ReelsPage> createState()=>_Reels();}
          class _Reels extends State<ReelsPage>{
            int coins=18750;
            final List<Map<String,String>> reels=[
              {"user":"@ahmed_tech","caption":"شلون تربح من الانترنت 2026؟","likes":"15.2K"},
              {"user":"@sara_design","caption":"تصميم بالذكاء الاصطناعي بدقيقة","likes":"9.8K"},
              {"user":"@iraq_coder","caption":"كود يخليك تربح 100$ يوميا","likes":"22K"},
              {"user":"@nour_learn","caption":"تعلم Flutter باسبوع","likes":"7.3K"},
              {"user":"@tech_iraq","caption":"افضل تطبيقات الربح","likes":"18K"},
            ];
            void addCoins(){setState(()=>coins+=50); ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تم اضافة 50 د.ع • رصيدك: $coins'),backgroundColor:Colors.green,behavior:SnackBarBehavior.floating));}
            @override Widget build(BuildContext c)=>Scaffold(backgroundColor:Colors.black,appBar:AppBar(backgroundColor:Colors.black,title:const Text('ريلزات • اربح بالمشاهدة'),actions:[Container(margin:const EdgeInsets.all(10),padding:const EdgeInsets.symmetric(horizontal:12,vertical:6),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(20),border:Border.all(color:Colors.green.withOpacity(0.5))),child:Row(children:[const Icon(Icons.account_balance_wallet,size:14,color:Colors.greenAccent),const SizedBox(width:6),Text('$coins د.ع',style:const TextStyle(color:Colors.greenAccent,fontWeight:FontWeight.bold))]))]),
              body: PageView.builder(itemCount:reels.length,itemBuilder:(c,i){
                final r=reels[i];
                return Stack(children:[
                  Container(width:double.infinity,height:double.infinity,decoration:BoxDecoration(gradient:LinearGradient(begin:Alignment.topLeft,end:Alignment.bottomRight,colors:[Colors.primaries[i%Colors.primaries.length].shade900,Colors.black])),child:Center(child:Icon(Icons.play_circle_fill,size:80,color:Colors.white.withOpacity(0.7)))),
                  Positioned(right:10,bottom:120,child:Column(children:[_btn(Icons.favorite, r['likes']!),_btn(Icons.comment,'892'),_btn(Icons.share,'Share'),_btn(Icons.card_giftcard,'هدية')])),
                  Positioned(left:12,right:70,bottom:30,child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(r['user']!,style:const TextStyle(fontWeight:FontWeight.bold,fontSize:15)),const SizedBox(height:6),Text(r['caption']!,style:const TextStyle(color:Colors.white)),const SizedBox(height:12),Container(padding:const EdgeInsets.symmetric(horizontal:10,vertical:5),decoration:BoxDecoration(color:Colors.green,borderRadius:BorderRadius.circular(20)),child:const Text('+50 د.ع / مشاهدة',style:TextStyle(fontSize:11,fontWeight:FontWeight.bold))),const SizedBox(height:10),Row(children:[Expanded(child:LinearProgressIndicator(value:(i+1)/reels.length,color:const Color(0xFF7C3AED),backgroundColor:Colors.white24)),const SizedBox(width:8),Text('${i+1}/${reels.length}',style:const TextStyle(fontSize:11))])])),
                  Center(child: ElevatedButton.icon(onPressed:addCoins,icon:const Icon(Icons.visibility),label:const Text('شاهد 10 ثواني واربح'),style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF7C3AED),padding:const EdgeInsets.symmetric(horizontal:24,vertical:12),shape:RoundedRectangleBorder(borderRadius:BorderRadius.circular(30))))),
                ]);
              })
            );
          }
          Widget _btn(IconData ic,String t)=>Padding(padding:const EdgeInsets.symmetric(vertical:10),child:Column(children:[CircleAvatar(backgroundColor:Colors.white24,child:Icon(ic,color:Colors.white,size:22)),const SizedBox(height:5),Text(t,style:const TextStyle(fontSize:10,color:Colors.white))]));
          // ===== WALLET =====
          class WalletPage extends StatefulWidget{const WalletPage({super.key});@override State<WalletPage> createState()=>_W();}
          class _W extends State<WalletPage>{
            int balance=18750;
            void showWithdraw(){showModalBottomSheet(context:context,backgroundColor:const Color(0xFF1A1A2E),shape:const RoundedRectangleBorder(borderRadius:BorderRadius.vertical(top:Radius.circular(20))),builder:(c)=>Padding(padding:const EdgeInsets.all(20),child:Column(mainAxisSize:MainAxisSize.min,crossAxisAlignment:CrossAxisAlignment.start,children:[const Text('سحب الرصيد',style:TextStyle(fontSize:18,fontWeight:FontWeight.bold)),const SizedBox(height:16),_payOpt('ZainCash','0% عمولة • فوري',Icons.phone_android),_payOpt('AsiaHawala','1% • فوري',Icons.account_balance),_payOpt('USDT TRC20','0% • 24 ساعة',Icons.currency_bitcoin),_payOpt('PayPal','2% • 2-3 ايام',Icons.payment),const SizedBox(height:16),TextField(decoration:InputDecoration(hintText:'رقم المحفظة / الايميل',filled:true,fillColor:const Color(0xFF0A0A12),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),),const SizedBox(height:10),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:(){Navigator.pop(context); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم ارسال طلب السحب - سيتم المراجعة خلال 24 ساعة')));},child:const Text('تأكيد السحب'),style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF10B981))))])));}
            void showSend(){showDialog(context:context,builder:(c)=>AlertDialog(backgroundColor:const Color(0xFF1E1E2A),title:const Text('ارسال رصيد'),content:Column(mainAxisSize:MainAxisSize.min,children:[TextField(decoration:InputDecoration(hintText:'اسم المستخدم او الرقم',filled:true,fillColor:const Color(0xFF0A0A12),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),),const SizedBox(height:10),TextField(keyboardType:TextInputType.number,decoration:InputDecoration(hintText:'المبلغ',filled:true,fillColor:const Color(0xFF0A0A12),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),)]),actions:[TextButton(onPressed:()=>Navigator.pop(c),child:const Text('الغاء')),ElevatedButton(onPressed:(){Navigator.pop(c); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم الارسال بنجاح')));},child:const Text('ارسال'))]));}
            @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(backgroundColor:const Color(0xFF1A1A2E),title:const Text('المحفظة')),body:ListView(padding:const EdgeInsets.all(16),children:[
              Container(padding:const EdgeInsets.all(22),decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF10B981),Color(0xFF059669)]),borderRadius:BorderRadius.circular(22)),child:Column(children:[const Text('رصيدك الحالي',style:TextStyle(color:Colors.white70)),const SizedBox(height:6),Text('$balance د.ع',style:const TextStyle(fontSize:34,fontWeight:FontWeight.bold)),const Text('≈ \$12.50 • قابل للسحب',style:TextStyle(color:Colors.white.withOpacity(0.8),fontSize:12)),const SizedBox(height:18),Row(children:[Expanded(child:ElevatedButton.icon(onPressed:showWithdraw,icon:const Icon(Icons.arrow_upward),label:const Text('سحب'),style:ElevatedButton.styleFrom(backgroundColor:Colors.white,foregroundColor:Colors.green,shape:RoundedRectangleBorder(borderRadius:BorderRadius.circular(12))))),const SizedBox(width:12),Expanded(child:ElevatedButton.icon(onPressed:showSend,icon:const Icon(Icons.send),label:const Text('ارسال'),style:ElevatedButton.styleFrom(backgroundColor:Colors.black54,foregroundColor:Colors.white,shape:RoundedRectangleBorder(borderRadius:BorderRadius.circular(12)))))] )])),
              const SizedBox(height:20), const Text('سجل العمليات',style:TextStyle(fontWeight:FontWeight.bold)), const SizedBox(height:8),
              _tx('+500 د.ع','مشاهدة ريلز','اليوم 10:30',true),_tx('-2,000 د.ع','سحب ZainCash','امس 15:20',false),_tx('+1,000 د.ع','مكافأة يومية','امس 09:00',true),_tx('+2,000 د.ع','دعوة صديق','2026/05/20',true),
            ]));
          }
          Widget _payOpt(String t,String d,IconData ic)=>ListTile(leading:CircleAvatar(backgroundColor:const Color(0xFF2A2A40),child:Icon(ic,color:Colors.white)),title:Text(t,style:const TextStyle(fontWeight:FontWeight.bold)),subtitle:Text(d,style:const TextStyle(fontSize:11,color:Colors.white54)),trailing:const Icon(Icons.arrow_forward_ios,size:14),onTap:(){});
          Widget _tx(String a,String b,String c,bool isIn)=>Container(margin:const EdgeInsets.only(bottom:8),padding:const EdgeInsets.all(12),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(12)),child:Row(children:[CircleAvatar(backgroundColor:isIn?Colors.green:Colors.red,child:Icon(isIn?Icons.add:Icons.arrow_upward,size:18,color:Colors.white)),const SizedBox(width:12),Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(a,style:TextStyle(fontWeight:FontWeight.bold,color:isIn?Colors.green:Colors.white)),Text(b,style:const TextStyle(fontSize:11,color:Colors.white54))])),Text(c,style:const TextStyle(fontSize:10,color:Colors.white38))]));
          // ===== CHAT =====
          class ChatPage extends StatefulWidget{const ChatPage({super.key});@override State<ChatPage> createState()=>_C();}
          class _C extends State<ChatPage>{
            final ctrl=TextEditingController(); final List<Map<String,String>> msgs=[{"role":"ai","text":"هلا! انا IraqAI Chat+\nاحجيلي اي شي واني اجاوبك"}]; bool load=false; late ChatSession chat;
            @override void initState(){super.initState(); final m=GenerativeModel(model:'gemini-2.0-flash',apiKey:GEMINI_API_KEY.isEmpty?'test':GEMINI_API_KEY, systemInstruction:Content.text('انت مساعد ذكي لهجتك عراقية عامية، مفيد جدا')); chat=m.startChat();}
            void send() async{ if(ctrl.text.trim().isEmpty) return; final q=ctrl.text; setState((){msgs.add({"role":"user","text":q}); load=true;}); ctrl.clear(); try{final r=await chat.sendMessage(Content.text(q)); setState(()=>msgs.add({"role":"ai","text":r.text??''}));}catch(e){setState(()=>msgs.add({"role":"ai","text":"تأكد من الانترنت"}));} setState(()=>load=false);}
            @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('دردشة ذكية')),body:Column(children:[Expanded(child:ListView.builder(padding:const EdgeInsets.all(12),itemCount:msgs.length,itemBuilder:(c,i){final m=msgs[i];final u=m['role']=='user';return Align(alignment:u?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:4),padding:const EdgeInsets.all(12),constraints:BoxConstraints(maxWidth:MediaQuery.of(c).size.width*0.8),decoration:BoxDecoration(color:u?const Color(0xFF7C3AED):const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(16)),child:Text(m['text']!)));})), if(load) const LinearProgressIndicator(), Padding(padding:const EdgeInsets.all(10),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'احجي...',filled:true,fillColor:const Color(0xFF1E1E2A),border:OutlineInputBorder(borderRadius:BorderRadius.circular(25),borderSide:BorderSide.none)),onSubmitted:(_)=>send())),const SizedBox(width:8),CircleAvatar(backgroundColor:const Color(0xFF7C3AED),child:IconButton(icon:const Icon(Icons.send),onPressed:send))]))]));
          }
          class EarnPage extends StatelessWidget{const EarnPage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('ارباح المشاهدات')),body:ListView(padding:const EdgeInsets.all(16),children:[Row(children:[Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('15,420',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)),Text('مشاهدة',style:TextStyle(fontSize:12,color:Colors.white54))]))),const SizedBox(width:8),Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('2,300 د.ع',style:TextStyle(fontSize:18,fontWeight:FontWeight.bold,color:Colors.green)),Text('اليوم',style:TextStyle(fontSize:12,color:Colors.white54))]))),const SizedBox(width:8),Expanded(child:Container(padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:const Column(children:[Text('3س 24د',style:TextStyle(fontSize:18,fontWeight:FontWeight.bold)),Text('وقت',style:TextStyle(fontSize:12,color:Colors.white54))])))]),const SizedBox(height:16),_e('شاهد 10 ريلزات','+1,500 د.ع',0.6),_e('اعجاب 20 فيديو','+800 د.ع',0.3),_e('انشر ريلز واحد','+3,000 د.ع',0.0),Container(padding:const EdgeInsets.all(16),decoration:BoxDecoration(gradient:const LinearGradient(colors:[Color(0xFF7C3AED),Color(0xFF6D28D9)]),borderRadius:BorderRadius.circular(16)),child:Row(children:[const Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text('دعوة اصدقاء = 2,000 د.ع',style:TextStyle(fontWeight:FontWeight.bold)),Text('شارك رابطك واربح',style:TextStyle(fontSize:12,color:Colors.white70))])),ElevatedButton(onPressed:(){},child:const Text('نسخ الرابط'))]))]));}
          Widget _e(String t,String r,double p)=>Container(margin:const EdgeInsets.only(bottom:10),padding:const EdgeInsets.all(14),decoration:BoxDecoration(color:const Color(0xFF1E1E2A),borderRadius:BorderRadius.circular(14)),child:Column(children:[Row(mainAxisAlignment:MainAxisAlignment.spaceBetween,children:[Text(t),Text(r,style:const TextStyle(color:Colors.green))]),const SizedBox(height:8),LinearProgressIndicator(value:p,color:const Color(0xFF7C3AED))]));
          class ProfilePage extends StatelessWidget{const ProfilePage({super.key});@override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('حسابي')),body:ListView(padding:const EdgeInsets.all(16),children:[Center(child:Column(children:[const CircleAvatar(radius:42,backgroundColor:Color(0xFF7C3AED),child:Text('إ',style:TextStyle(fontSize:32))),const SizedBox(height:10),const Text('إبراهيم الجواد',style:TextStyle(fontSize:19,fontWeight:FontWeight.bold)),Container(padding:const EdgeInsets.symmetric(horizontal:10,vertical:4),decoration:BoxDecoration(color:Colors.amber.withOpacity(0.2),borderRadius:BorderRadius.circular(10)),child:const Text('Premium Member',style:TextStyle(color:Colors.amber,fontSize:12)))])),const SizedBox(height:20),const ListTile(leading:Icon(Icons.settings),title:Text('الاعدادات')),const ListTile(leading:Icon(Icons.privacy_tip),title:Text('سياسة الخصوصية')),const ListTile(leading:Icon(Icons.description),title:Text('شروط الاستخدام')),const ListTile(leading:Icon(Icons.share),title:Text('مشاركة التطبيق')),const ListTile(leading:Icon(Icons.star,color:Colors.amber),title:Text('قيمنا على Play Store'))]));}
          DART
          cat > pubspec.yaml << 'YAML'
          name: iraqai_chat
          description: IraqAI Chat+ Reels Wallet Earn
          publish_to: 'none'
          version: 1.0.0+12
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            google_generative_ai: ^0.4.4
          flutter:
            uses-material-design: true
          YAML
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - run: flutter build appbundle --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: iraqai-playstore-aab-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
